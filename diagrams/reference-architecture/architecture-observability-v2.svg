<svg viewBox="0 0 1340 1420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="au" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/></marker>
    <marker id="tr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="sy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <style>
      .t  { font-size:13px; font-weight:800; fill:#0f172a; }
      .h  { font-size:15px; font-weight:800; }
      .s  { font-size:11.5px; font-weight:700; fill:#0f172a; }
      .g  { font-size:10px; fill:#475569; }
      .fl { stroke:#334155; stroke-width:2.2; fill:none; }
      .au { stroke:#b91c1c; stroke-width:2.6; fill:none; }
      .tr { stroke:#7c3aed; stroke-width:2.2; fill:none; stroke-dasharray:5 3; }
      .sy { stroke:#0891b2; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1340" height="1420" fill="#f8fafc"/>
  <text x="30" y="38" font-size="23" font-weight="800" fill="#0f172a">Logging, Monitoring &amp; Observability — Azure</text>
  <text x="30" y="60" font-size="13" fill="#64748b">Monitoring = "is it healthy?" (known). Observability = "why?" (unknown). Instrument ONCE with OpenTelemetry; audit logging is a SEPARATE, immutable path.</text>

  <!-- SYNTHETIC (outside-in) — top strip -->
  <rect x="30" y="80" width="1280" height="60" rx="10" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="44" y="102" class="s" fill="#0e7490">Synthetic / black-box monitoring (OUTSIDE-IN) — hits the system from outside, on a schedule</text>
  <rect x="44" y="110" width="230" height="22" rx="5" fill="#fff" stroke="#67e8f9"/><text class="g" x="52" y="125">Azure Monitor availability tests / canary probes</text>
  <text x="290" y="118" class="g">Inside-out telemetry tells you how the system feels about itself.</text>
  <text x="290" y="132" class="g">If the app is fully DOWN it emits nothing — only the synthetic probe fires. This is what catches "users can't log in" while dashboards look calm.</text>
  <line x1="150" y1="140" x2="150" y2="170" class="sy" marker-end="url(#sy)"/>
  <text x="158" y="160" class="g" fill="#0e7490" font-style="italic">probes the public entry (Front Door)</text>

  <!-- SOURCE: services emit -->
  <rect x="30" y="176" width="250" height="410" rx="12" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="44" y="200" class="t" fill="#0369a1">Services on AKS (Istio mesh)</text>
  <text x="44" y="218" class="g">app emits plain OTel; sidecar adds trace context</text>
  <rect x="46" y="230" width="100" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text class="s" x="56" y="252" font-size="11">claim</text>
  <rect x="158" y="230" width="106" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text class="s" x="168" y="252" font-size="10.5">authz-score</text>
  <rect x="46" y="272" width="100" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text class="s" x="56" y="294" font-size="11">payment</text>
  <rect x="158" y="272" width="106" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text class="s" x="168" y="294" font-size="11">saga</text>

  <text x="44" y="332" class="s" fill="#0369a1">Each service emits 3 signals:</text>
  <rect x="46" y="344" width="218" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text class="g" x="56" y="363"><tspan font-weight="700" fill="#1d4ed8">Metrics</tspan> — RED (rate/errors/duration)</text>
  <rect x="46" y="380" width="218" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/><text class="g" x="56" y="399"><tspan font-weight="700" fill="#166534">Logs</tspan> — structured JSON, PII redacted</text>
  <rect x="46" y="416" width="218" height="30" rx="6" fill="#faf5ff" stroke="#d8b4fe"/><text class="g" x="56" y="435"><tspan font-weight="700" fill="#6b21a8">Traces</tspan> — spans w/ W3C traceparent</text>

  <rect x="46" y="458" width="218" height="118" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="56" y="478" class="s" fill="#b91c1c" font-size="11">SEPARATE: audit events</text>
  <text x="56" y="496" class="g">"who did what, to what data,</text>
  <text x="56" y="512" class="g">when" — NOT app logs.</text>
  <text x="56" y="530" class="g">Complete (never sampled),</text>
  <text x="56" y="546" class="g">emitted on its own channel.</text>
  <text x="56" y="566" class="g" font-style="italic" fill="#b91c1c">different pipeline → red path</text>

  <!-- trace flow WITHIN source: forward direction claim->...->saga -->
  <path class="tr" d="M108,264 L108,250 L220,250 L220,272" fill="none" marker-end="url(#tr)"/>
  <text x="60" y="228" class="g" fill="#7c3aed" font-style="italic" font-size="9">trace ID flows forward with the request →</text>

  <!-- OTEL COLLECTOR -->
  <rect x="320" y="230" width="180" height="300" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="334" y="254" class="t" fill="#92400e">OTel Collector</text>
  <text x="334" y="274" class="g">(DaemonSet / gateway)</text>
  <text x="334" y="296" class="g">ONE vendor-neutral</text>
  <text x="334" y="312" class="g">pipeline for all 3 signals</text>
  <text x="334" y="336" class="s" font-size="10.5">receive → process → export</text>
  <text x="334" y="358" class="g">• batching</text>
  <text x="334" y="374" class="g">• PII redaction / attributes</text>
  <text x="334" y="390" class="g">• tail-based sampling</text>
  <text x="334" y="406" class="g">&#160;&#160;(keep errored + slow traces,</text>
  <text x="334" y="422" class="g">&#160;&#160;sample the boring successes)</text>
  <text x="334" y="446" class="g" font-style="italic" fill="#92400e">Swap backends here without</text>
  <text x="334" y="462" class="g" font-style="italic" fill="#92400e">touching a line of app code.</text>

  <line x1="280" y1="359" x2="318" y2="359" class="fl" marker-end="url(#d)"/>
  <line x1="280" y1="395" x2="318" y2="380" class="fl" marker-end="url(#d)"/>
  <line x1="280" y1="431" x2="318" y2="410" class="fl" marker-end="url(#d)"/>

  <!-- AZURE BACKENDS -->
  <rect x="540" y="176" width="360" height="470" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="554" y="200" class="t" fill="#1d4ed8">Azure Monitor (one platform)</text>

  <rect x="556" y="212" width="328" height="72" rx="8" fill="#faf5ff" stroke="#d8b4fe"/><text class="s" x="568" y="232" fill="#6b21a8">Application Insights</text><text class="g" x="568" y="250">APP-level: distributed TRACES + APM,</text><text class="g" x="568" y="264">dependency map, live metrics</text><text class="g" x="568" y="278" font-style="italic">(app behaviour — not infra)</text>

  <rect x="556" y="294" width="328" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/><text class="s" x="568" y="314" fill="#166534">Log Analytics workspace</text><text class="g" x="568" y="332">central LOG store · KQL · diagnostic</text><text class="g" x="568" y="346">settings ship logs here (by policy)</text>

  <rect x="556" y="362" width="328" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text class="s" x="568" y="382" fill="#1d4ed8">Managed Prometheus + Grafana</text><text class="g" x="568" y="400">INFRA / K8s metrics: nodes, pods, HPA —</text><text class="g" x="568" y="414">the layer App Insights doesn't cover.</text><text class="g" x="568" y="428" font-style="italic">split: Prometheus = infra, App Insights = app</text>

  <rect x="556" y="444" width="328" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text class="s" x="568" y="464" fill="#991b1b">Microsoft Sentinel (SIEM)</text><text class="g" x="568" y="482">security analytics + threat detection on</text><text class="g" x="568" y="496">the same workspace</text>

  <text x="556" y="524" class="s" fill="#1d4ed8">Correlation — the microservices-hard part:</text>
  <rect x="556" y="534" width="328" height="100" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="568" y="554" class="g"><tspan font-weight="700" fill="#6b21a8">One trace ID follows the whole request:</tspan></text>
  <text x="568" y="572" class="g">claim → authz-score → [Event Hubs] → saga → payment</text>
  <text x="568" y="592" class="g">• Sync hops: W3C traceparent header (auto)</text>
  <text x="568" y="610" class="g" font-weight="700" fill="#6b21a8">• Async hop: inject trace context into the Event</text>
  <text x="568" y="624" class="g" font-weight="700" fill="#6b21a8">&#160;&#160;Hubs headers — or the trace breaks at the bus</text>

  <line x1="500" y1="290" x2="538" y2="248" class="fl" marker-end="url(#d)"/>
  <line x1="500" y1="359" x2="538" y2="320" class="fl" marker-end="url(#d)"/>
  <line x1="500" y1="418" x2="538" y2="398" class="fl" marker-end="url(#d)"/>

  <!-- synthetic feeds availability into backend -->
  <path class="sy" d="M150,132 L150,158 L920,158 L920,240 L902,240" fill="none" marker-end="url(#sy)"/>

  <!-- ALERTING -->
  <rect x="940" y="176" width="370" height="290" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="954" y="200" class="t" fill="#9a3412">Alerting — avoid alert fatigue</text>
  <text x="954" y="222" class="g">alert on SYMPTOMS (user-facing), not causes (raw CPU)</text>

  <rect x="956" y="234" width="338" height="70" rx="8" fill="#fff" stroke="#fdba74"/>
  <text class="s" x="968" y="254">SLO / SLI + error budget</text>
  <text class="g" x="968" y="272">SLI = % requests &lt; 300ms · SLO = 99.5%</text>
  <text class="g" x="968" y="288">alert on BURN RATE: fast burn → page,</text>
  <text class="g" x="968" y="300" font-size="9.5">slow burn → ticket</text>

  <rect x="956" y="314" width="338" height="52" rx="8" fill="#fff" stroke="#fdba74"/>
  <text class="s" x="968" y="334">Tiered severity</text>
  <text class="g" x="968" y="352">page = user impact · ticket = degradation ·</text>
  <text class="g" x="968" y="364" font-size="9.5">dashboard-only = informational</text>

  <rect x="956" y="376" width="338" height="78" rx="8" fill="#fff" stroke="#fdba74"/>
  <text class="s" x="968" y="396">What to watch (name the method)</text>
  <text class="g" x="968" y="414">RED for services: Rate · Errors · Duration</text>
  <text class="g" x="968" y="430">USE for resources: Utilization · Saturation ·</text>
  <text class="g" x="968" y="444" font-size="9.5">Errors (nodes, pools, queues)</text>

  <line x1="884" y1="330" x2="938" y2="330" class="fl" marker-end="url(#d)"/>

  <!-- CONSUMPTION / ON-CALL -->
  <rect x="940" y="480" width="370" height="106" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="954" y="504" class="t" fill="#166534">Consumption — who sees it, who gets woken</text>
  <rect x="956" y="514" width="160" height="30" rx="6" fill="#fff" stroke="#86efac"/><text class="g" x="964" y="533">Grafana / Azure dashboards</text>
  <rect x="1126" y="514" width="168" height="30" rx="6" fill="#fff" stroke="#86efac"/><text class="g" x="1134" y="533">PagerDuty / Opsgenie on-call</text>
  <rect x="956" y="550" width="338" height="28" rx="6" fill="#fff" stroke="#86efac"/><text class="g" x="964" y="568">runbook link on every alert · escalation policy · post-incident review feeds SLOs</text>

  <line x1="1125" y1="454" x2="1125" y2="478" class="fl" marker-end="url(#d)"/>

  <!-- AUDIT PATH -->
  <rect x="940" y="600" width="370" height="180" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="954" y="624" class="t" fill="#991b1b">Audit path — SEPARATE &amp; immutable (BFSI)</text>
  <rect x="956" y="636" width="338" height="42" rx="7" fill="#fff" stroke="#fca5a5"/><text class="s" x="968" y="654" fill="#991b1b" font-size="10.5">Azure Activity Log</text><text class="g" x="968" y="670">who changed the infrastructure</text>
  <rect x="956" y="684" width="338" height="42" rx="7" fill="#fff" stroke="#fca5a5"/><text class="s" x="968" y="702" fill="#991b1b" font-size="10.5">Kubernetes API audit log</text><text class="g" x="968" y="718">who changed the cluster</text>
  <rect x="956" y="732" width="338" height="40" rx="7" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text class="s" x="968" y="751" fill="#991b1b" font-size="10.5">→ Immutable WORM storage</text><text class="g" x="968" y="766">Azure Storage immutability · years retention</text>

  <path class="au" d="M264,524 L900,524 L900,650 L954,650" fill="none" marker-end="url(#au)"/>
  <text x="360" y="518" class="g" font-style="italic" fill="#b91c1c">audit events bypass the app-log pipeline entirely</text>

  <!-- ANSWER BOX -->
  <rect x="30" y="806" width="1280" height="596" rx="12" fill="#0f172a"/>
  <text x="54" y="842" font-size="18" font-weight="800" fill="#fff">Say it in this order</text>

  <text x="54" y="876" class="h" fill="#93c5fd" font-size="13.5">1 · Three words aren't synonyms.</text>
  <text x="54" y="896" font-size="12" fill="#e2e8f0">Monitoring = "is it healthy?" (known Qs, dashboards+alerts). Observability = "why?" (unknown Qs, explore telemetry). Logging is one input, not the strategy.</text>

  <text x="54" y="926" class="h" fill="#fcd34d" font-size="13.5">2 · Three pillars, instrumented once.</text>
  <text x="54" y="946" font-size="12" fill="#e2e8f0">Metrics (cheap, alerting — RED/USE), logs (forensics — structured JSON), traces (the request's journey). OTel emits all three; the collector is the one</text>
  <text x="54" y="964" font-size="12" fill="#e2e8f0">place I swap backends. Split the metric backends: Prometheus/Grafana for infra + K8s, App Insights for app-level traces and APM.</text>

  <text x="54" y="994" class="h" fill="#22d3ee" font-size="13.5">3 · Inside-out AND outside-in.</text>
  <text x="54" y="1014" font-size="12" fill="#e2e8f0">The app's own telemetry tells me how it feels about itself. Synthetic probes tell me what the user experiences — and if the app is fully down, only the</text>
  <text x="54" y="1032" font-size="12" fill="#e2e8f0">synthetic probe fires. Without black-box monitoring, a total outage can leave your dashboards looking calm.</text>

  <text x="54" y="1062" class="h" fill="#c4b5fd" font-size="13.5">4 · Correlation is the microservices-hard part.</text>
  <text x="54" y="1082" font-size="12" fill="#e2e8f0">One trace ID follows a request across every service AND across Event Hubs — inject trace context into the message headers or the trace breaks at the</text>
  <text x="54" y="1100" font-size="12" fill="#e2e8f0">bus, and "payment is slow" never resolves to "because authz-score timed out."</text>

  <text x="54" y="1130" class="h" fill="#fdba74" font-size="13.5">5 · Alert on symptoms, not causes.</text>
  <text x="54" y="1150" font-size="12" fill="#e2e8f0">SLO burn rate + user-facing latency/errors page a human; CPU at 80% that isn't hurting anyone is a dashboard. Every alert carries a runbook link and</text>
  <text x="54" y="1168" font-size="12" fill="#e2e8f0">an escalation policy — a page nobody knows how to action is just noise.</text>

  <text x="54" y="1198" class="h" fill="#fca5a5" font-size="13.5">6 · Audit logging ≠ application logging (the BFSI differentiator).</text>
  <text x="54" y="1218" font-size="12" fill="#e2e8f0">App logs: sampled, weeks, debugging, PII redacted. Audit logs: complete, immutable, years, WORM, tamper-evident — different pipeline. "An audit log an</text>
  <text x="54" y="1236" font-size="12" fill="#e2e8f0">administrator can delete isn't an audit log." Diagnostic settings enforced by policy so it's never something a team forgets to enable.</text>

  <line x1="54" y1="1264" x2="1286" y2="1264" stroke="#334155"/>
  <text x="54" y="1292" class="h" fill="#67e8f9" font-size="13.5">The one-paragraph answer:</text>
  <text x="54" y="1312" font-size="12" fill="#e2e8f0">"Instrument once with OpenTelemetry → Azure Monitor: App Insights for app traces, Log Analytics for logs, managed Prometheus + Grafana for infra</text>
  <text x="54" y="1330" font-size="12" fill="#e2e8f0">metrics, plus synthetic probes for outside-in. One trace ID propagated through the mesh and into Event Hubs headers so it survives the async hop.</text>
  <text x="54" y="1348" font-size="12" fill="#e2e8f0">Alert on SLO burn rate, every alert with a runbook. And for a bank, audit logging is a separate immutable WORM pipeline, PII kept out of app logs,</text>
  <text x="54" y="1366" font-size="12" fill="#e2e8f0">diagnostic settings enforced by policy."</text>
  <text x="54" y="1392" font-size="12" font-style="italic" fill="#94a3b8">Honesty check: know which of this your repo actually implements vs. what's target design — "tracing + structured logging are in; sampling + WORM audit are the design I'd add."</text>
</svg>
