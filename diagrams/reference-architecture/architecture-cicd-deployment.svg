<svg viewBox="0 0 1340 1320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="gate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <style>
      .t  { font-size:13px; font-weight:800; fill:#0f172a; }
      .s  { font-size:11.5px; font-weight:700; fill:#0f172a; }
      .g  { font-size:10px; fill:#475569; }
      .h  { font-size:15px; font-weight:800; }
      .fl { stroke:#334155; stroke-width:2.4; fill:none; }
      .gk { fill:#fef2f2; stroke:#fca5a5; }
    </style>
  </defs>
  <rect x="0" y="0" width="1340" height="1320" fill="#f8fafc"/>
  <text x="30" y="38" font-size="23" font-weight="800" fill="#0f172a">Deployment Topology &amp; CI/CD — security-gated pipeline (BFSI)</text>
  <text x="30" y="60" font-size="13" fill="#64748b">Different diagram from runtime: this is how CODE reaches prod safely. Every red gate can FAIL the build. Nothing promotes on green alone — a human approves prod.</text>

  <!-- ================= CI PIPELINE ================= -->
  <text x="30" y="98" class="h" fill="#0f172a" font-size="16">CI — on every pull request (fail fast, shift left)</text>
  <rect x="30" y="110" width="1280" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- source -->
  <rect x="46" y="130" width="120" height="70" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text class="s" x="58" y="152">Git PR</text><text class="g" x="58" y="170">trunk-based,</text><text class="g" x="58" y="184">short-lived branch</text><text class="g" x="58" y="198">branch protection</text>

  <!-- gate 1: pre-commit / secrets -->
  <rect x="186" y="130" width="130" height="70" rx="9" class="gk"/><text class="s" x="198" y="150" fill="#991b1b" font-size="11">🔒 Secrets scan</text><text class="g" x="198" y="168">gitleaks / trufflehog</text><text class="g" x="198" y="182">blocks committed</text><text class="g" x="198" y="196">keys &amp; tokens</text>

  <!-- gate 2: SAST -->
  <rect x="336" y="130" width="130" height="70" rx="9" class="gk"/><text class="s" x="348" y="150" fill="#991b1b" font-size="11">🔒 SAST</text><text class="g" x="348" y="168">SonarQube / Semgrep</text><text class="g" x="348" y="182">CodeQL — code-level</text><text class="g" x="348" y="196">vulns, quality gate</text>

  <!-- gate 3: SCA -->
  <rect x="486" y="130" width="130" height="70" rx="9" class="gk"/><text class="s" x="498" y="150" fill="#991b1b" font-size="11">🔒 SCA</text><text class="g" x="498" y="168">Dependency scan +</text><text class="g" x="498" y="182">license check</text><text class="g" x="498" y="196">(Snyk / OWASP DC)</text>

  <!-- gate 4: unit + coverage -->
  <rect x="636" y="130" width="130" height="70" rx="9" class="gk"/><text class="s" x="648" y="150" fill="#991b1b" font-size="11">Unit + coverage</text><text class="g" x="648" y="168">JUnit, min % gate</text><text class="g" x="648" y="182">contract tests</text><text class="g" x="648" y="196">(Pact)</text>

  <!-- build image -->
  <rect x="786" y="130" width="130" height="70" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text class="s" x="798" y="150">Build image</text><text class="g" x="798" y="168">multi-stage,</text><text class="g" x="798" y="182">distroless base,</text><text class="g" x="798" y="196">non-root</text>

  <!-- gate 5: image scan -->
  <rect x="936" y="130" width="130" height="70" rx="9" class="gk"/><text class="s" x="948" y="150" fill="#991b1b" font-size="11">🔒 Image scan</text><text class="g" x="948" y="168">Trivy / Defender</text><text class="g" x="948" y="182">CVEs in layers —</text><text class="g" x="948" y="196">block on critical</text>

  <!-- gate 6: sign + SBOM -->
  <rect x="1086" y="130" width="130" height="70" rx="9" class="gk"/><text class="s" x="1098" y="150" fill="#991b1b" font-size="10.5">🔒 Sign + SBOM</text><text class="g" x="1098" y="168">Cosign signature</text><text class="g" x="1098" y="182">SBOM (SPDX/</text><text class="g" x="1098" y="196">CycloneDX)</text>

  <!-- push to ACR -->
  <rect x="1120" y="230" width="176" height="60" rx="9" fill="#f0fdfa" stroke="#5eead4"/><text class="s" x="1132" y="252">Azure Container Registry</text><text class="g" x="1132" y="270">signed image + SBOM,</text><text class="g" x="1132" y="282">geo-replicated, quarantine</text>

  <!-- arrows across CI -->
  <line x1="166" y1="165" x2="184" y2="165" class="fl" marker-end="url(#f)"/>
  <line x1="316" y1="165" x2="334" y2="165" class="fl" marker-end="url(#f)"/>
  <line x1="466" y1="165" x2="484" y2="165" class="fl" marker-end="url(#f)"/>
  <line x1="616" y1="165" x2="634" y2="165" class="fl" marker-end="url(#f)"/>
  <line x1="766" y1="165" x2="784" y2="165" class="fl" marker-end="url(#f)"/>
  <line x1="916" y1="165" x2="934" y2="165" class="fl" marker-end="url(#f)"/>
  <line x1="1066" y1="165" x2="1084" y2="165" class="fl" marker-end="url(#f)"/>
  <line x1="1151" y1="200" x2="1180" y2="228" class="fl" marker-end="url(#f)"/>

  <text x="46" y="228" class="g" font-style="italic" fill="#991b1b">Each 🔒 gate can FAIL the PR — a failing gate blocks merge. This is "shift left": vulnerabilities caught at PR cost minutes, not an incident in prod.</text>
  <text x="46" y="330" class="g" font-style="italic">Runner: GitHub Actions / Azure DevOps. Auth to Azure via OIDC workload identity federation — no stored cloud credentials in the pipeline.</text>

  <!-- ================= CD / GITOPS ================= -->
  <text x="30" y="410" class="h" fill="#0f172a" font-size="16">CD — GitOps promotion through environments</text>
  <rect x="30" y="422" width="1280" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- config repo -->
  <rect x="46" y="446" width="150" height="80" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text class="s" x="58" y="468">Config repo (Git)</text><text class="g" x="58" y="486">desired state = k8s</text><text class="g" x="58" y="500">manifests / Helm.</text><text class="g" x="58" y="514">Git is the source of truth</text>

  <!-- Argo -->
  <rect x="220" y="446" width="150" height="80" rx="9" fill="#f0fdf4" stroke="#86efac"/><text class="s" x="232" y="468">ArgoCD / Flux</text><text class="g" x="232" y="486">reconciles cluster to</text><text class="g" x="232" y="500">Git. Drift = auto-revert.</text><text class="g" x="232" y="514">Rollback = git revert</text>

  <line x1="196" y1="486" x2="218" y2="486" class="fl" marker-end="url(#f)"/>
  <line x1="1296" y1="260" x2="1300" y2="260" class="fl"/>
  <path class="fl" d="M1296,260 L1310,260 L1310,486 L372,486" fill="none" marker-end="url(#f)"/>
  <text x="1150" y="475" class="g" font-style="italic">image tag bump → PR to config repo</text>

  <!-- DEV -->
  <rect x="400" y="446" width="180" height="290" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="414" y="468" class="t" fill="#1d4ed8">DEV (AKS ns)</text>
  <text class="g" x="414" y="488">auto-deploy on merge</text>
  <text class="g" x="414" y="504">smoke tests</text>
  <rect x="414" y="516" width="150" height="46" rx="7" class="gk"/><text class="s" x="424" y="534" fill="#991b1b" font-size="10.5">🔒 DAST</text><text class="g" x="424" y="550">OWASP ZAP against</text>
  <text x="414" y="584" class="g">running app — runtime</text>
  <text x="414" y="600" class="g">vulns SAST can't see</text>
  <rect x="414" y="612" width="150" height="46" rx="7" class="gk"/><text class="s" x="424" y="630" fill="#991b1b" font-size="10.5">🔒 IaC scan</text><text class="g" x="424" y="646">Checkov/tfsec on</text>
  <text x="414" y="680" class="g">Terraform before</text>
  <text x="414" y="696" class="g">any infra change</text>

  <line x1="580" y1="590" x2="608" y2="590" class="fl" marker-end="url(#f)"/>

  <!-- STAGING -->
  <rect x="612" y="446" width="180" height="290" rx="10" fill="#fefce8" stroke="#fde047"/>
  <text x="626" y="468" class="t" fill="#854d0e">STAGING (AKS ns)</text>
  <text class="g" x="626" y="488">prod-like, prod data</text>
  <text class="g" x="626" y="504">shape (masked)</text>
  <rect x="626" y="516" width="150" height="44" rx="7" class="gk"/><text class="s" x="636" y="534" fill="#991b1b" font-size="10.5">Integration + E2E</text><text class="g" x="636" y="550">full suite</text>
  <rect x="626" y="566" width="150" height="44" rx="7" class="gk"/><text class="s" x="636" y="584" fill="#991b1b" font-size="10.5">Load / soak (k6)</text><text class="g" x="636" y="600">validates HPA, pods</text>
  <rect x="626" y="616" width="150" height="44" rx="7" class="gk"/><text class="s" x="636" y="634" fill="#991b1b" font-size="10.5">DR / chaos drill</text><text class="g" x="636" y="650">fault injection</text>
  <rect x="626" y="666" width="150" height="52" rx="7" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text class="s" x="636" y="686" fill="#991b1b" font-size="10.5">👤 Manual approval</text><text class="g" x="636" y="702">change advisory /</text><text class="g" x="636" y="714">release manager sign-off</text>

  <line x1="792" y1="590" x2="820" y2="590" class="fl" marker-end="url(#f)"/>

  <!-- PROD -->
  <rect x="824" y="446" width="470" height="290" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="838" y="468" class="t" fill="#166534">PROD (AKS — progressive delivery)</text>
  <text class="g" x="838" y="488">segregation of duties: the approver is not the author (SOX / audit requirement)</text>

  <rect x="838" y="500" width="200" height="90" rx="8" fill="#fff" stroke="#86efac"/>
  <text class="s" x="850" y="520">Canary (Argo Rollouts)</text>
  <text class="g" x="850" y="538">5% → 25% → 50% → 100%</text>
  <text class="g" x="850" y="554">promote only if SLOs hold</text>
  <text class="g" x="850" y="570">(error rate, P99, saturation)</text>
  <text class="g" x="850" y="584">auto-rollback on breach</text>

  <rect x="1054" y="500" width="224" height="90" rx="8" fill="#fff" stroke="#86efac"/>
  <text class="s" x="1066" y="520">Blue/Green (alt.)</text>
  <text class="g" x="1066" y="538">full standby env, flip traffic</text>
  <text class="g" x="1066" y="554">at the ingress, instant</text>
  <text class="g" x="1066" y="570">rollback by flipping back —</text>
  <text class="g" x="1066" y="584">use for DB-risky releases</text>

  <rect x="838" y="602" width="440" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="s" x="850" y="622">Feature flags decouple deploy from release</text>
  <text class="g" x="850" y="640">ship code dark, enable per-cohort — a release is a config change, not a redeploy</text>

  <rect x="838" y="668" width="440" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text class="s" x="850" y="688" fill="#991b1b">Admission control at deploy: OPA Gatekeeper / Azure Policy for AKS</text>
  <text class="g" x="850" y="706">rejects unsigned images, privileged pods, no-limits, non-allowlisted registries — policy-as-code, inherited</text>

  <!-- ================= ANSWER BOX ================= -->
  <rect x="30" y="778" width="1280" height="510" rx="12" fill="#0f172a"/>
  <text x="54" y="814" font-size="18" font-weight="800" fill="#fff">How to walk this for a BFSI panel</text>

  <text x="54" y="850" class="h" fill="#fca5a5" font-size="14">Shift left — every security gate runs at PR, not before release.</text>
  <text x="54" y="872" font-size="12.5" fill="#e2e8f0">Secrets scan, SAST, SCA, image scan, sign+SBOM — a vulnerability caught at the PR costs minutes; the same one in prod is an incident and an audit finding.</text>
  <text x="54" y="890" font-size="12.5" fill="#e2e8f0">Each gate can fail the build. "Green pipeline" is a precondition to merge, never a free pass to prod.</text>

  <text x="54" y="926" class="h" fill="#86efac" font-size="14">GitOps — Git is the source of truth, the cluster reconciles to it.</text>
  <text x="54" y="948" font-size="12.5" fill="#e2e8f0">ArgoCD/Flux pull the desired state from a config repo. Drift auto-reverts. Rollback is a git revert. Every prod change is a reviewed, audited commit —</text>
  <text x="54" y="966" font-size="12.5" fill="#e2e8f0">which is exactly the change-management evidence SOX and auditors ask for: who changed what, when, and who approved it.</text>

  <text x="54" y="1002" class="h" fill="#fcd34d" font-size="14">Environments gate risk progressively.</text>
  <text x="54" y="1024" font-size="12.5" fill="#e2e8f0">Dev = fast + DAST + IaC scan. Staging = prod-like, full E2E + load/soak + chaos + a HUMAN approval. Prod = canary with SLO-gated auto-promotion,</text>
  <text x="54" y="1042" font-size="12.5" fill="#e2e8f0">blue/green when a release is DB-risky, feature flags to separate deploy from release.</text>

  <text x="54" y="1078" class="h" fill="#c4b5fd" font-size="14">The controls an auditor specifically wants to hear:</text>
  <text x="54" y="1100" font-size="12.5" fill="#e2e8f0">• Segregation of duties — approver ≠ author (the canary approval is a different person).  • Signed images + admission control — prod refuses to run</text>
  <text x="54" y="1118" font-size="12.5" fill="#e2e8f0">an unsigned or unscanned image (Cosign verify at admission).  • SBOM per release — you can answer "are we exposed to CVE-X?" in minutes.</text>
  <text x="54" y="1136" font-size="12.5" fill="#e2e8f0">• OIDC workload identity — no long-lived cloud credentials stored in the pipeline.  • Immutable audit trail — the Git history IS the change log.</text>

  <line x1="54" y1="1164" x2="1286" y2="1164" stroke="#334155"/>
  <text x="54" y="1192" class="h" fill="#67e8f9" font-size="14">The one-sentence version:</text>
  <text x="54" y="1214" font-size="13" fill="#e2e8f0">"Security gates shift left to the PR — secrets, SAST, SCA, image scan, sign and SBOM — then GitOps promotes a signed image through dev, staging</text>
  <text x="54" y="1232" font-size="13" fill="#e2e8f0">and prod, with a human approval before prod and canary with SLO-gated auto-rollback after. Prod won't run an unsigned image because admission control</text>
  <text x="54" y="1250" font-size="13" fill="#e2e8f0">rejects it — and the whole thing is auditable because Git is the source of truth."</text>
  <text x="54" y="1280" font-size="12.5" font-style="italic" fill="#94a3b8">Runtime topology = how traffic flows. This = how code ships. Keep them as two diagrams; never draw them as one.</text>
</svg>
