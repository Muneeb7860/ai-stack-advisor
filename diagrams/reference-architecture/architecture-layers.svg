<svg viewBox="0 0 1180 1500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .layer   { rx:10; ry:10; }
      .ltitle  { font-size:19px; font-weight:700; fill:#0f172a; }
      .lnum    { font-size:15px; font-weight:700; fill:#ffffff; }
      .comp    { font-size:14px; font-weight:600; fill:#0f172a; }
      .sub     { font-size:12px; fill:#475569; }
      .cloud   { font-size:11.5px; fill:#334155; }
      .note    { font-size:12.5px; fill:#7c2d12; font-style:italic; }
      .flow    { stroke:#64748b; stroke-width:2.5; fill:none; }
      .pill    { rx:7; ry:7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="1500" fill="#f8fafc"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#0f172a">Reference Architecture — top-to-bottom request flow</text>
  <text x="40" y="72" font-size="14.5" fill="#64748b">Read it as: a request enters at the top and travels down. Each numbered band is ONE layer. Cloud columns = the same box in AWS / Azure / GCP.</text>

  <!-- ================= LAYER 1: CLIENTS ================= -->
  <rect class="layer" x="40" y="95" width="1100" height="92" fill="#eef2ff" stroke="#c7d2fe"/>
  <circle cx="70" cy="141" r="15" fill="#6366f1"/><text class="lnum" x="70" y="146" text-anchor="middle">1</text>
  <text class="ltitle" x="100" y="130">Client tier — the interfaces</text>
  <rect class="pill" x="100" y="142" width="185" height="34" fill="#fff" stroke="#c7d2fe"/><text class="comp" x="112" y="164">Admin web (React)</text>
  <rect class="pill" x="300" y="142" width="215" height="34" fill="#fff" stroke="#c7d2fe"/><text class="comp" x="312" y="164">Customer web (React)</text>
  <rect class="pill" x="530" y="142" width="245" height="34" fill="#fff" stroke="#c7d2fe"/><text class="comp" x="542" y="164">Mobile (React Native OR Flutter)</text>
  <rect class="pill" x="790" y="142" width="180" height="34" fill="#fff" stroke="#c7d2fe"/><text class="comp" x="802" y="164">B2B / partner portal</text>

  <path class="flow" d="M590,187 L590,205" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 2: DNS ================= -->
  <rect class="layer" x="40" y="210" width="1100" height="78" fill="#ecfeff" stroke="#a5f3fc"/>
  <circle cx="70" cy="249" r="15" fill="#06b6d4"/><text class="lnum" x="70" y="254" text-anchor="middle">2</text>
  <text class="ltitle" x="100" y="243">DNS — name resolution, geo &amp; failover routing</text>
  <text class="cloud" x="100" y="270">AWS: Route 53   •   Azure: Azure DNS   •   GCP: Cloud DNS</text>
  <text class="note" x="640" y="270">Route 53 is DNS — NOT a load balancer.</text>

  <path class="flow" d="M590,288 L590,306" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 3: EDGE ================= -->
  <rect class="layer" x="40" y="311" width="1100" height="88" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="70" cy="355" r="15" fill="#22c55e"/><text class="lnum" x="70" y="360" text-anchor="middle">3</text>
  <text class="ltitle" x="100" y="345">Edge — CDN + WAF + DDoS protection</text>
  <text class="cloud" x="100" y="372">AWS: CloudFront + WAF + Shield   •   Azure: Front Door + WAF   •   GCP: Cloud CDN + Cloud Armor</text>
  <text class="cloud" x="100" y="391">Cross-cloud alternative: Cloudflare (DNS + CDN + WAF + DDoS in one) — replaces parts of layers 2–3, don't stack both.</text>

  <path class="flow" d="M590,399 L590,417" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 4: GLOBAL LB ================= -->
  <rect class="layer" x="40" y="422" width="1100" height="78" fill="#fefce8" stroke="#fef08a"/>
  <circle cx="70" cy="461" r="15" fill="#eab308"/><text class="lnum" x="70" y="466" text-anchor="middle">4</text>
  <text class="ltitle" x="100" y="455">Load Balancer — network entry, TLS termination, health routing</text>
  <text class="cloud" x="100" y="482">AWS: ALB / NLB (+ Global Accelerator)   •   Azure: Front Door / App Gateway   •   GCP: Cloud Load Balancing (GLB)</text>

  <path class="flow" d="M590,500 L590,518" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 5: API GATEWAY ================= -->
  <rect class="layer" x="40" y="523" width="1100" height="86" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="70" cy="566" r="15" fill="#f97316"/><text class="lnum" x="70" y="571" text-anchor="middle">5</text>
  <text class="ltitle" x="100" y="556">API Gateway — authN/Z, rate limiting, quotas, versioning, mediation</text>
  <text class="cloud" x="100" y="583">AWS: API Gateway   •   Azure: API Management (APIM)   •   GCP: Apigee</text>
  <text class="note" x="100" y="601">Order to memorise:  DNS → Edge → Load Balancer → Gateway.  LB is the network door; the gateway is application-layer policy — it comes AFTER the LB.</text>

  <path class="flow" d="M590,609 L590,627" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 6: COMPUTE PLATFORM (the key one) ================= -->
  <rect class="layer" x="40" y="632" width="1100" height="250" fill="#fef2f2" stroke="#fecaca" stroke-width="2.5"/>
  <circle cx="70" cy="676" r="15" fill="#ef4444"/><text class="lnum" x="70" y="681" text-anchor="middle">6</text>
  <text class="ltitle" x="100" y="666">Compute platform — WHERE YOUR SERVICES RUN</text>
  <text class="note" x="100" y="688" font-size="14" fill="#b91c1c" font-weight="700">This is the layer you were unsure about. K8s / OpenShift / Cloud Run all live HERE. They are ALTERNATIVES for this one box — you pick ONE. They are not sequential steps.</text>

  <!-- three alternatives side by side -->
  <rect class="pill" x="100" y="702" width="325" height="160" fill="#fff" stroke="#fecaca"/>
  <text x="115" y="726" class="comp" font-size="15" fill="#b91c1c">Option A — Kubernetes</text>
  <text x="115" y="748" class="sub">GKE / EKS / AKS (self-managed nodes)</text>
  <text x="115" y="768" class="sub">GKE Autopilot = no node ops</text>
  <text x="115" y="792" class="sub" font-weight="600" fill="#334155">Pick when:</text>
  <text x="115" y="810" class="sub">• steady baseline load</text>
  <text x="115" y="828" class="sub">• need pod-level control (sidecars,</text>
  <text x="115" y="844" class="sub">&#160;&#160;DaemonSets, Istio mesh)</text>
  <text x="115" y="860" class="sub" fill="#b91c1c">✓ no cold start · you pay for idle nodes</text>

  <rect class="pill" x="437" y="702" width="300" height="160" fill="#fff" stroke="#fecaca"/>
  <text x="452" y="726" class="comp" font-size="15" fill="#b91c1c">Option B — OpenShift</text>
  <text x="452" y="748" class="sub">Kubernetes + enterprise layer</text>
  <text x="452" y="768" class="sub">(Red Hat support, built-in CI/CD,</text>
  <text x="452" y="784" class="sub">&#160;&#160;stricter security defaults)</text>
  <text x="452" y="808" class="sub" font-weight="600" fill="#334155">Pick when:</text>
  <text x="452" y="826" class="sub">• on-prem / hybrid mandate</text>
  <text x="452" y="844" class="sub">• enterprise needs vendor support</text>
  <text x="452" y="860" class="sub" fill="#b91c1c">✓ same layer as K8s, heavier + licensed</text>

  <rect class="pill" x="749" y="702" width="378" height="160" fill="#fff" stroke="#fecaca"/>
  <text x="764" y="726" class="comp" font-size="15" fill="#b91c1c">Option C — Serverless containers</text>
  <text x="764" y="748" class="sub">Cloud Run / Container Apps / App Runner</text>
  <text x="764" y="768" class="sub">no cluster, no nodes, scale-to-zero</text>
  <text x="764" y="792" class="sub" font-weight="600" fill="#334155">Pick when:</text>
  <text x="764" y="810" class="sub">• bursty / spiky traffic</text>
  <text x="764" y="828" class="sub">• stateless, low ops burden</text>
  <text x="764" y="846" class="sub" fill="#b91c1c">✗ cold starts (bad for JVM/Spring Boot —</text>
  <text x="764" y="862" class="sub" fill="#b91c1c">&#160;&#160;set min-instances≥1 or use GraalVM)</text>

  <path class="flow" d="M590,882 L590,900" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 7: SERVICES ================= -->
  <rect class="layer" x="40" y="905" width="1100" height="96" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="70" cy="953" r="15" fill="#3b82f6"/><text class="lnum" x="70" y="958" text-anchor="middle">7</text>
  <text class="ltitle" x="100" y="938">Services — your bounded contexts (run ON layer 6)</text>
  <rect class="pill" x="100" y="952" width="120" height="34" fill="#fff" stroke="#bfdbfe"/><text class="comp" x="112" y="974" font-size="12.5">auth</text>
  <rect class="pill" x="232" y="952" width="120" height="34" fill="#fff" stroke="#bfdbfe"/><text class="comp" x="244" y="974" font-size="12.5">contribution</text>
  <rect class="pill" x="364" y="952" width="120" height="34" fill="#fff" stroke="#bfdbfe"/><text class="comp" x="376" y="974" font-size="12.5">claim</text>
  <rect class="pill" x="496" y="952" width="120" height="34" fill="#fff" stroke="#bfdbfe"/><text class="comp" x="508" y="974" font-size="12.5">payment</text>
  <rect class="pill" x="628" y="952" width="130" height="34" fill="#fff" stroke="#bfdbfe"/><text class="comp" x="640" y="974" font-size="12.5">saga-orchestr.</text>
  <rect class="pill" x="770" y="952" width="120" height="34" fill="#fff" stroke="#bfdbfe"/><text class="comp" x="782" y="974" font-size="12.5">rewards</text>
  <rect class="pill" x="902" y="952" width="130" height="34" fill="#fff" stroke="#bfdbfe"/><text class="comp" x="914" y="974" font-size="12.5">notification</text>
  <text class="sub" x="100" y="998" fill="#1e40af">Service-to-service security &amp; traffic: Istio service mesh (mTLS, default-deny east-west) wraps this layer.</text>

  <!-- split arrows to async + data -->
  <path class="flow" d="M590,1001 L590,1024" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 8: ASYNC ================= -->
  <rect class="layer" x="40" y="1029" width="1100" height="86" fill="#faf5ff" stroke="#e9d5ff"/>
  <circle cx="70" cy="1072" r="15" fill="#a855f7"/><text class="lnum" x="70" y="1077" text-anchor="middle">8</text>
  <text class="ltitle" x="100" y="1062">Async backbone — cross-context events (sync stays in-layer, async goes here)</text>
  <text class="cloud" x="100" y="1089">Kafka (replay + ordering)   •   AWS: SNS/SQS, EventBridge, MSK   •   Azure: Event Hubs / Service Bus   •   GCP: Pub/Sub</text>
  <text class="sub" x="100" y="1108">Pattern: Transactional Outbox → CDC (Debezium) → topic.  Saga orchestrator coordinates the loan workflow across services.</text>

  <path class="flow" d="M590,1115 L590,1133" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 9: DATA ================= -->
  <rect class="layer" x="40" y="1138" width="1100" height="130" fill="#f0fdfa" stroke="#99f6e4"/>
  <circle cx="70" cy="1182" r="15" fill="#14b8a6"/><text class="lnum" x="70" y="1187" text-anchor="middle">9</text>
  <text class="ltitle" x="100" y="1172">Data tier — each service owns its own store</text>
  <rect class="pill" x="100" y="1188" width="235" height="66" fill="#fff" stroke="#99f6e4"/>
  <text class="comp" x="114" y="1210" font-size="13">PostgreSQL (OLTP)</text><text class="sub" x="114" y="1230">Cloud SQL / AlloyDB / RDS</text><text class="sub" x="114" y="1247">+ pgvector for RAG (no separate DB)</text>
  <rect class="pill" x="347" y="1188" width="215" height="66" fill="#fff" stroke="#99f6e4"/>
  <text class="comp" x="361" y="1210" font-size="13">Redis (cache/session)</text><text class="sub" x="361" y="1230">Memorystore / ElastiCache</text><text class="sub" x="361" y="1247">rate-limit, locks, idempotency</text>
  <rect class="pill" x="574" y="1188" width="230" height="66" fill="#fff" stroke="#99f6e4"/>
  <text class="comp" x="588" y="1210" font-size="13">NoSQL (only if needed)</text><text class="sub" x="588" y="1230">Mongo/Cassandra/DynamoDB</text><text class="sub" x="588" y="1247">justify with a named access pattern</text>
  <rect class="pill" x="816" y="1188" width="230" height="66" fill="#fff" stroke="#99f6e4"/>
  <text class="comp" x="830" y="1210" font-size="13">OLAP (analytics sink)</text><text class="sub" x="830" y="1230">BigQuery / Redshift / Synapse</text><text class="sub" x="830" y="1247">fed from layer 8 — never OLTP</text>

  <!-- ================= CROSS-CUTTING SIDEBAR ================= -->
  <rect class="layer" x="40" y="1288" width="1100" height="180" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="ltitle" x="60" y="1316">Cross-cutting — wraps every layer above (not a step in the flow)</text>

  <rect class="pill" x="60" y="1330" width="255" height="120" fill="#fff" stroke="#cbd5e1"/>
  <text class="comp" x="74" y="1352">Security &amp; secrets</text>
  <text class="sub" x="74" y="1374">Secret Manager / Key Vault</text>
  <text class="sub" x="74" y="1392">Workload identity (no static keys)</text>
  <text class="sub" x="74" y="1410">TLS 1.3, CMK at rest</text>
  <text class="sub" x="74" y="1428">SAST/DAST/SCA in pipeline</text>
  <text class="sub" x="74" y="1446">+ OWASP LLM Top 10 for AI layer</text>

  <rect class="pill" x="327" y="1330" width="255" height="120" fill="#fff" stroke="#cbd5e1"/>
  <text class="comp" x="341" y="1352">Observability</text>
  <text class="sub" x="341" y="1374">OpenTelemetry (instrument once)</text>
  <text class="sub" x="341" y="1392">→ ONE backend: Dynatrace OR</text>
  <text class="sub" x="341" y="1410">&#160;&#160;ELK OR Splunk (not all three)</text>
  <text class="sub" x="341" y="1428">Metrics / logs / traces</text>
  <text class="sub" x="341" y="1446">SLO + error-budget alerts</text>

  <rect class="pill" x="594" y="1330" width="255" height="120" fill="#fff" stroke="#cbd5e1"/>
  <text class="comp" x="608" y="1352">Delivery</text>
  <text class="sub" x="608" y="1374">Git → CI (build, scan, sign)</text>
  <text class="sub" x="608" y="1392">CD: GitOps (ArgoCD/Flux)</text>
  <text class="sub" x="608" y="1410">IaC: Terraform (plan as PR gate)</text>
  <text class="sub" x="608" y="1428">Deploy: blue/green · canary · rolling</text>
  <text class="sub" x="608" y="1446">Load test (k6/Gatling) sizes pods</text>

  <rect class="pill" x="861" y="1330" width="259" height="120" fill="#fff" stroke="#cbd5e1"/>
  <text class="comp" x="875" y="1352">Governance</text>
  <text class="sub" x="875" y="1374">TOGAF ADM · COBIT 2019</text>
  <text class="sub" x="875" y="1392">SAFe / ART · ITIL v4</text>
  <text class="sub" x="875" y="1410">GDPR · PDPL (residency)</text>
  <text class="sub" x="875" y="1428">Policy-as-code, inherited</text>
  <text class="sub" x="875" y="1446">Audit logs → immutable store</text>
</svg>
