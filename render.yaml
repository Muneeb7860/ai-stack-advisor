# Render blueprint for the advisor's backend.
#
# What this deploys, and what it deliberately does not:
#
#   * The API only. index.html stays on GitHub Pages — it is the whole frontend, has no build
#     step, and per AGENTS.md the core analysis must keep running client-side with zero network
#     calls. This service exists for the optional AI features (/api/refine, /api/ask), saved
#     analyses and sharing.
#
#   * No Anthropic key. Callers supply their own per request (schemas.py's anthropic_api_key,
#     read in routers/ask.py and refine.py), so this service holds no LLM secret and carries no
#     per-request token cost. That is why there is no secret env var below.
#
#   * No Ollama, so no RAG grounding. retrieval.py embeds via a local Ollama daemon that does
#     not exist on a managed host. It degrades rather than failing — _get_index() returns None
#     and /api/refine and /api/ask answer without corpus citations instead of 500ing. Wiring a
#     hosted embeddings provider is the follow-up that turns grounding back on.
#
#   * The KB corpus is not in the image. retrieval.py resolves it as ../../docs relative to
#     itself, i.e. a sibling of backend/, but dockerContext below is backend/ only. Moot while
#     retrieval is off; it must be addressed in the same change that restores embeddings.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo. Render reads this file,
# creates both resources and links them. Nothing here needs a value filled in by hand.

databases:
  - name: advisor-db
    databaseName: advisor
    user: advisor
    plan: free

services:
  - type: web
    name: ai-stack-advisor-api
    runtime: docker
    plan: free
    region: oregon

    # The build context is backend/, matching the Dockerfile's own `COPY requirements.txt .`.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # main.py:54. Render will not route traffic until this returns 200, which also means the
    # first deploy fails visibly if alembic could not reach the database, rather than serving
    # a container with no schema.
    healthCheckPath: /health

    envVars:
      # Render supplies this on the legacy `postgres://` scheme, which SQLAlchemy 2.x rejects
      # outright — Settings._normalise_pg_scheme rewrites it to postgresql+psycopg2://. Without
      # that, both `alembic upgrade head` and db.py's create_engine() fail at import and the
      # only symptom is a container that "won't start". See test_database_url_normalisation.py.
      - key: DATABASE_URL
        fromDatabase:
          name: advisor-db
          property: connectionString

      # The origin only — scheme and host, no path. main.py splits this on commas into
      # CORSMiddleware's allow_origins; a trailing /ai-stack-advisor would never match the
      # browser's Origin header and every request would fail CORS with the API up and healthy.
      - key: CORS_ORIGINS
        value: https://muneeb7860.github.io

      # The container CMD runs `alembic upgrade head` before uvicorn. Correct for a single
      # instance; set to 0 and run migrations as a one-off job if this is ever scaled out, since
      # several cold-starting containers would otherwise race the same migration.
      - key: RUN_MIGRATIONS
        value: "1"
