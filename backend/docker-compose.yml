services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor
      POSTGRES_DB: advisor
    ports:
      - "5432:5432"
    volumes:
      - advisor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://advisor:advisor@db:5432/advisor
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      # app/retrieval.py's embeddings and app/llm_providers.py's local fallback both call out
      # to Ollama, which runs on the HOST, not as a container in this compose file (it's a
      # pre-existing local daemon, not something this project provisions) — "localhost" from
      # inside this container means the container itself, not the host, so this must be
      # host.docker.internal instead. Works on Docker Desktop and colima; if your Docker setup
      # doesn't support host.docker.internal, override with your host's LAN IP.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # LLM_PROVIDER deliberately NOT set here — defaults to config.py's "anthropic" (see
      # llm_providers.py's module docstring: opt-in only, Claude stays primary). Previously
      # this was hardcoded to "ollama" for one live-testing session and left in by mistake —
      # that silently broke test_refine.py::test_refine_rejects_ollama_provider_when_not_enabled
      # and its test_ask.py counterpart, since every test run against this compose stack
      # inherited an opted-in deployment instead of the documented default. Caught by a full
      # test-suite run, not assumed fixed. To exercise the Ollama path locally again, set it
      # ad hoc: `LLM_PROVIDER=ollama docker compose up -d` — don't commit it back to this file.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/srv/app/app
      - ./alembic:/srv/app/alembic
      - ./tests:/srv/app/tests
      # app/retrieval.py resolves the corpus as ../../docs/use-case-knowledge-base relative to
      # itself (i.e. sibling of backend/, matching the real repo layout) — since the Docker
      # build context is backend/ only, docs/ is never baked into the image, so it's mounted
      # here instead. Read-only: this backend never writes to the corpus.
      - ../docs/use-case-knowledge-base:/srv/docs/use-case-knowledge-base:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  advisor_pg_data:
